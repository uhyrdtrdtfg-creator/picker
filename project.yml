name: Picker
options:
  bundleIdPrefix: app.picker
  deploymentTarget:
    macOS: "13.0"
targets:
  Picker:
    type: application
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - Apps/Picker
    info:
      path: Apps/Picker/Info.plist
      properties:
        CFBundleShortVersionString: "1.0.6"
        CFBundleVersion: "6"
        LSApplicationCategoryType: public.app-category.utilities
        LSUIElement: false
        NSAccessibilityUsageDescription: Picker needs Accessibility access to read the text you select and to perform actions.
        NSAppleEventsUsageDescription: Picker uses automation to read the active browser tab URL when checking excluded websites.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.picker.mac
        PRODUCT_NAME: Picker
        MARKETING_VERSION: "1.0.6"
        CURRENT_PROJECT_VERSION: "6"
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_VERSION: "5.0"
        CODE_SIGN_IDENTITY: "-"
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: NO
  PickerTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - Apps/PickerTests
      - Apps/Picker/Monitor/AccessibilityFocusedElementClient.swift
      - Apps/Picker/Monitor/SelectionMonitor.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.picker.mac.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        CODE_SIGN_IDENTITY: "-"
schemes:
  Picker:
    build:
      targets:
        Picker: all
        PickerTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - PickerTests
